# Tests run here too, so a broken build never deploys, even without GitHub's checks.
[build]
  command = "npm test && npm run build && npm run test:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"


# The page CSP is generated per page as a <meta> tag (see astro.config.mjs).
# frame-ancestors only works as a header, so it lives here.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Astro fingerprints everything in /_astro (the hash changes when the content does),
# so browsers can keep it for a year without checking back.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
